name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy --strict src/
      - name: Pytest (explicit empty-suite handling)
        shell: bash
        run: |
          code=0
          uv run pytest || code=$?
          if [ "$code" -eq 5 ]; then
            echo "Empty suite: no tests collected (pytest exit 5); no tests passed."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
